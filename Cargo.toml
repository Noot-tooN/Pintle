[workspace]
members = ["crates/auth", "crates/core", "crates/cloudflare", "crates/protocol", "tools/proto-gen"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
